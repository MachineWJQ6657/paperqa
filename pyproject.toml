[project]
name = "paperqa"
version = "0.1.0"
description = "RAG question answering over research papers, evaluated on QASPER"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=2.0",
    "chromadb>=1.0",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "tqdm>=4.66",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paperqa"]

# CPU-only torch on Linux/Windows keeps the install small (~200MB instead of
# several GB of CUDA libraries). Embedding ~14k paragraphs with a small model is
# fine on CPU. Delete this block if you have a GPU and want CUDA torch.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
